name: check
on: [push, pull_request]
jobs:
  linux-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: zig (настоящие заголовки Windows для окон)
        run: pip install ziglang
      - name: CHECK.sh
        run: sh tools/CHECK.sh
